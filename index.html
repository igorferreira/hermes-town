<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hermes Town — Cidade Réplica do TimeAutomático</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="game"></div>
    <div id="hud">
      <div id="masthead">
        <div class="kicker">cidade réplica do timeautomático</div>
        <div class="title">Hermes Town</div>
        <div id="status" class="status">iniciando</div>
      </div>
      <div id="controls">
        <button id="overview">Vista da cidade</button>
        <button data-goto="library">Biblioteca</button>
        <button data-goto="workshop">Oficina</button>
        <button data-goto="forge">Forja</button>
        <button data-goto="post">Correio</button>
        <button data-goto="observatory">Observatório</button>
        <button data-goto="hall">Prefeitura</button>
        <button data-goto="tavern">Taverna</button>
        <button id="follow">Seguir: desligado</button>
        <button id="director" class="on">Diretor: ligado</button>
      </div>
      <div id="panel" hidden></div>
      <canvas id="minimap" width="192" height="120"></canvas>
      <div id="foot">arraste para mover · role para ampliar · clique num morador</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
